name: 'Main'

on:
  workflow_dispatch:
  push:
    branches:
      - production

jobs:

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  version-number:
    name: 'Version Number'
    runs-on: ubuntu-latest
    steps:
      - id: generate-version-number
        run: |
          version="$(date +%Y%m%d).$(date +%H%M).$(date +%S)"
          echo "Generated version: $version"
          echo "version_number=$version" >> "$GITHUB_OUTPUT"
    outputs:
      version_number: ${{ steps.generate-version-number.outputs.version_number }}

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  publish-connectors:
    name: 'Publish Connectors'
    needs: version-number
    uses: ./.github/workflows/publish-connectors.yml
    with:
      version_number: ${{ needs.version-number.outputs.version_number }}

  publish-lib:
    name: 'Publish package'
    runs-on: ubuntu-latest
    needs: version-number
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          node-version: 20

      - name: Build package
        working-directory: .
        run: npm run build:lib

      - name: Bump package version
        run: npm version --no-git-tag-version ${{ inputs.version_number }}

      - name: Publish package to NPM
        working-directory: packages/lib
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

