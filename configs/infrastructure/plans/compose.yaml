name: plans

services:
  #

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  watchtower:
    image: containrrr/watchtower
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
      resources:
        limits:
          memory: 100mb
    logging:
      options:
        max-size: '1m'
        max-file: '1'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=TRUE
      - WATCHTOWER_INCLUDE_STOPPED=TRUE
      - WATCHTOWER_REVIVE_STOPPED=TRUE
      - WATCHTOWER_ROLLING_RESTART=TRUE

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  plans-db:
    image: mongo:latest
    restart: always
    ports:
      - 27017:27017
    volumes:
      - ./plans-entrypoint.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./plans-keyfile.key:/data/replica.key
      - ./plans-db-data:/data/db
    env_file:
      - .env
    entrypoint:
      - bash
      - -c
      - |
          chmod 400 /data/replica.key
          chown 999:999 /data/replica.key
          exec docker-entrypoint.sh $$@
    command: mongod --bind_ip_all --auth --replSet rs0 --keyFile /data/replica.key --port 27017

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - 5672:5672 # amqp
      - 15672:15672 # management
    env_file:
      - .env

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  backupd:
    image: ghcr.io/tmlmobilidade/backupd:production
    volumes:
      - ./backupd-data:/data/backups
      - ./backupd.yaml:/config.yaml
    environment:
      - CONFIG_PATH=/config.yaml
    depends_on:
      - plans-db
