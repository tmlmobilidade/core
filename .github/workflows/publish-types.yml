name: 'Publish Types'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - production
    paths:
      - 'packages/core/src/**/*.type.ts'
      - 'packages/core/src/utils/**/*.ts'
      - '.github/workflows/publish-types.yml'
  push:
    branches:
      - production
    paths:
      - 'packages/core/src/**/*.type.ts'
      - 'packages/core/src/utils/**/*.ts'
      - '.github/workflows/publish-types.yml'

jobs:

  test-core:
    name: 'Test Core'
    uses: ./.github/workflows/test-core.yml
    with:
      node-version: 20

  build-and-publish:
    name: 'Build & Publish Types'
    strategy:
      matrix:
        node-version: [20]

    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build package
        working-directory: packages/core
        run: npm run build:types
