name: 'Publish Types'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - production
    paths:
      - 'packages/core/src/**/*.type.ts'
      - 'packages/core/src/utils/**/*.ts'
      - '.github/workflows/publish-types.yml'
  push:
    branches:
      - production
    paths:
      - 'packages/core/src/**/*.type.ts'
      - 'packages/core/src/utils/**/*.ts'
      - '.github/workflows/publish-types.yml'

jobs:

  lint:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}

      - name: Linting
        run: pnpm lint --filter=@tmlmobilidade/core



  build:
    strategy:
      matrix:
        node-version: [20]

    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build package
        run: |
          cd packages/core
          pnpm build:types

  publish:
    strategy:
      matrix:
        node-version: [20]

    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}

      - name: Bump package version
        run: npx @helperkits/bumper bump

      - name: Publish package to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

