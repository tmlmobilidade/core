name: sae-development-db

# # # # # # # # # # # # # # # # # # # # #
# # # # # # # # # # # # # # # # # # # # #

services:
  #

  database:
    image: mongo:latest
    restart: always
    ports:
      - 27017:27017
    volumes:
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./replica.key:/data/replica.key
    env_file:
      - .env
    entrypoint:
      - bash
      - -c
      - |
          chmod 400 /data/replica.key
          chown 999:999 /data/replica.key
          exec docker-entrypoint.sh $$@
    command: mongod --bind_ip_all --auth --replSet rs0 --keyFile /data/replica.key --port 27017

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - 5672:5672 # amqp
      - 15672:15672 # management
    env_file:
      - ./secrets/.env
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
