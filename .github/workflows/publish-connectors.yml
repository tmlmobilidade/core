name: 'connectors | Publish to npm'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - production
    paths:
      - 'packages/connectors/**/*'
      - '.github/workflows/publish-connectors.yml'
  push:
    branches:
      - production
    paths:
      - 'packages/connectors/**/*'
      - '.github/workflows/publish-connectors.yml'

jobs:

  # # # # # # # # # # # # # # # # # # # # #
  # # # # # # # # # # # # # # # # # # # # #

  test-ui:
    name: 'Test UI'
    uses: ./.github/workflows/test-ui.yml
    with:
      node-version: 20

  publish:
    name: 'Build & Publish UI'
    runs-on: ubuntu-latest
    needs: test-ui
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          node-version: 20

      - name: Bump package version
        working-directory: packages/ui
        run: npx @helperkits/bumper bump

      - name: Build UI
        working-directory: packages/ui
        run: pnpm build

      - name: Publish UI
        working-directory: packages/ui
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}